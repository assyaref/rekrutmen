<script type="text/x-template" id="tpl">
<div>
  <!-- ================= LOADING ================= -->
  <div v-if="booting" class="boot"><div class="spinner"></div><span>Memuat…</span></div>

  <!-- ================= CAREERS (PUBLIK) ================= -->
  <div v-else-if="view==='careers'" class="careers">
    <section class="c-hero">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
      <div class="c-container">
        <div class="c-top-in">
          <div class="c-brand-wrap">
            <span v-if="logoState==='img'" class="logo-plate"><img :src="logoSrc" @error="onLogoError" :alt="S.company_name"></span>
            <span v-else-if="logoState==='loading'" class="logo-plate skel"></span>
            <span v-else class="logo-mark">{{ initials(S.company_name) }}</span>
            <span class="c-brand" :class="{'with-logo':logoState!=='none'}">{{ S.company_name }}</span>
          </div>
          <div class="spacer"></div>
          <button class="btn glass sm" @click="goAdmin"><ico n="lock" :s="14"></ico>Masuk Admin</button>
        </div>
        <div class="c-hero-body">
          <span v-if="feat('careers_enabled')" class="eyebrow"><span class="pulse"></span>Kami sedang merekrut · {{ pub.jobs.length }} posisi terbuka</span>
          <h1>{{ titleParts[0] }} <span class="hl">{{ titleParts[1] }}</span></h1>
          <p class="lead">{{ S.careers_intro }}</p>
          <div v-if="feat('careers_enabled')" class="hero-stats">
            <div><div class="n">{{ pub.jobs.length }}</div><div class="l">Posisi terbuka</div></div>
            <span class="sep"></span>
            <div><div class="n">{{ pubDepts.length }}</div><div class="l">Departemen</div></div>
            <span class="sep"></span>
            <div><div class="n">{{ pubLocs }}</div><div class="l">Lokasi kerja</div></div>
          </div>
        </div>
      </div>
    </section>

    <div v-if="feat('careers_enabled')" class="c-container c-search-wrap">
      <div class="c-search">
        <div class="input-icon"><ico n="search" :s="18"></ico><input v-model="cf.q" placeholder="Cari posisi, departemen, atau kata kunci"></div>
        <select v-model="cf.loc"><option value="">Semua lokasi</option><option v-for="v in pubMaster('location')" :key="v">{{ v }}</option></select>
        <select v-model="cf.type"><option value="">Semua tipe</option><option v-for="v in pubMaster('job_type')" :key="v">{{ v }}</option></select>
        <button class="btn primary" @click="scrollToJobs"><ico n="search" :s="16"></ico>Cari</button>
      </div>
    </div>

    <div v-if="!feat('careers_enabled')" class="c-container c-closed">
      <div class="closed-box">
        <div class="ic"><ico n="lock" :s="24"></ico></div>
        <h3>Halaman karir sedang ditutup</h3>
        <p class="pre">{{ S.careers_closed_message || 'Saat ini kami belum membuka lowongan. Silakan kembali lagi nanti.' }}</p>
      </div>
    </div>
    <main v-else class="c-container c-list" id="jobs">
      <div class="c-list-h">
        <div><div class="sec-kicker">Karier</div><h2>Posisi yang sedang dibuka</h2></div>
        <div class="spacer"></div><span class="muted num">Menampilkan {{ pubJobs.length }} dari {{ pub.jobs.length }} lowongan</span>
      </div>
      <div class="chips" v-if="pubDepts.length">
        <button class="chip all" :class="{on:!cf.dept}" @click="cf.dept=''">Semua <span class="cn">{{ pub.jobs.length }}</span></button>
        <button v-for="d in pubDepts" :key="d.name" class="chip" :class="{on:cf.dept===d.name}" :style="hueStyle(d.name)" @click="cf.dept=cf.dept===d.name?'':d.name"><span class="cdot"></span>{{ d.name }} <span class="cn">{{ d.count }}</span></button>
      </div>
      <div v-if="!pubJobs.length" class="card empty-state">
        <div class="ic"><ico n="briefcase" :s="20"></ico></div>
        <h4>Belum ada lowongan yang sesuai</h4>
        <p>Coba ubah kata kunci atau filter pencarian Anda.</p>
      </div>
      <div class="jobs-grid">
        <article v-for="j in pubJobs" :key="j.id" class="job" :style="hueStyle(j.department||j.title)" @click="openJob(j)">
          <div class="job-top">
            <span class="dept-ic"><ico :n="deptIcon(j.department)" :s="20"></ico></span>
            <div style="min-width:0"><div class="job-dept">{{ j.department || 'Umum' }}</div></div>
            <span v-if="isNewJob(j)" class="job-new">Baru</span>
          </div>
          <h3>{{ j.title }}</h3>
          <div class="tags">
            <span v-if="j.location" class="tag loc"><ico n="pin" :s="13"></ico>{{ j.location }}</span>
            <span v-if="j.type" class="tag type"><ico n="clock" :s="13"></ico>{{ j.type }}</span>
            <span v-if="j.salary && isTrue(S.show_salary)" class="tag sal"><ico n="wallet" :s="13"></ico>{{ j.salary }}</span>
          </div>
          <div class="job-foot">
            <ico n="calendar" :s="14"></ico><span>{{ j.deadline ? 'Hingga ' + fmtDate(j.deadline) : 'Dibuka hingga terisi' }}</span>
            <span class="more">{{ S.apply_button_text || 'Lamar' }} <ico n="arrowRight" :s="15"></ico></span>
          </div>
        </article>
      </div>
    </main>

    <section v-if="benefits.length && feat('show_benefits')" class="c-container c-benefits">
      <div class="sec-kicker">Budaya &amp; benefit</div>
      <h2 style="font-size:24px;font-weight:700;letter-spacing:-.02em">Mengapa bergabung bersama kami</h2>
      <div class="ben-grid">
        <div v-for="(b,i) in benefits" :key="i" class="ben" :style="{'--h':[230,165,280,25,200,330][i%6]}">
          <span class="bi"><ico :n="['users','award','wallet','clock','globe','activity'][i%6]" :s="20"></ico></span>
          <h4>{{ b.t }}</h4><p>{{ b.d }}</p>
        </div>
      </div>
    </section>

    <div v-if="S.cta_title && feat('show_cta') && feat('careers_enabled')" class="c-container">
      <div class="c-cta">
        <div style="flex:1;min-width:240px"><h3>{{ S.cta_title }}</h3><p>{{ S.cta_text }}</p></div>
        <a v-if="S.cta_email" class="btn white lg" :href="'mailto:'+S.cta_email"><ico n="mail" :s="16"></ico>Kirim CV Anda</a>
        <button v-else class="btn white lg" @click="cf.q='';cf.dept='';cf.loc='';cf.type='';scrollToJobs()"><ico n="briefcase" :s="16"></ico>Lihat semua posisi</button>
      </div>
    </div>

    <footer class="c-foot">
      <div class="c-container">
        <div class="c-brand-wrap"><span class="logo-mark">{{ initials(S.company_name) }}</span><span class="c-brand">{{ S.company_name }}</span></div>
        <div class="spacer"></div><span>{{ S.footer_text }}</span>
      </div>
    </footer>

    <!-- Detail + form lamaran -->
    <div v-if="cj" class="overlay" @click.self="cj=null">
      <div class="modal xl">
        <div class="modal-h hero-h">
          <div style="min-width:0">
            <div class="job-dept" style="margin-bottom:6px">{{ cj.department || 'Umum' }}</div>
            <h3 style="font-size:23px;margin-bottom:12px;letter-spacing:-.02em">{{ cj.title }}</h3>
            <div class="tags">
              <span v-if="cj.location" class="tag"><ico n="pin" :s="13"></ico>{{ cj.location }}</span>
              <span v-if="cj.type" class="tag"><ico n="clock" :s="13"></ico>{{ cj.type }}</span>
              <span v-if="cj.salary && isTrue(S.show_salary)" class="tag"><ico n="wallet" :s="13"></ico>{{ cj.salary }}</span>
              <span v-if="cj.deadline" class="tag"><ico n="calendar" :s="13"></ico>Hingga {{ fmtDate(cj.deadline) }}</span>
            </div>
          </div>
          <button class="x" @click="cj=null" aria-label="Tutup"><ico n="x" :s="18"></ico></button>
        </div>
        <div class="modal-b">
          <div v-if="applied" class="success-box">
            <div class="ic"><ico n="check" :s="26"></ico></div>
            <h3>Lamaran terkirim</h3>
            <p class="muted pre">{{ S.success_message }}</p>
            <button class="btn" @click="cj=null">Tutup</button>
          </div>
          <template v-else>
            <div class="prose">
              <div v-if="cj.description" class="blk"><h4>Deskripsi pekerjaan</h4><div class="pre">{{ cj.description }}</div></div>
              <div v-if="cj.requirements" class="blk"><h4>Kualifikasi</h4><div class="pre">{{ cj.requirements }}</div></div>
            </div>
            <div v-if="!feat('applications_enabled')" class="closed-box" style="padding:32px 20px;box-shadow:none">
              <div class="ic"><ico n="lock" :s="22"></ico></div>
              <h3>Penerimaan lamaran sedang ditutup</h3>
              <p>Silakan kembali lagi nanti untuk melamar posisi ini.</p>
            </div>
            <div v-else class="apply-panel">
              <h3>Form lamaran</h3>
              <p class="muted small" style="margin:4px 0 20px">Isi data di bawah ini. Kolom bertanda <span class="req">*</span> wajib diisi.</p>
              <form @submit.prevent="submitApply">
                <input v-model="af.website" style="display:none" tabindex="-1" autocomplete="off">
                <div class="grid g2" style="gap:0 16px">
                  <div class="field"><label class="lbl">Nama lengkap <span class="req">*</span></label><input v-model="af.name" required autocomplete="name"></div>
                  <div class="field"><label class="lbl">Email <span class="req">*</span></label><input v-model="af.email" type="email" required autocomplete="email"></div>
                  <div class="field"><label class="lbl">No. HP / WhatsApp</label><input v-model="af.phone" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></div>
                  <div v-for="f in pub.fields" :key="f.id" class="field" :class="{'span-2':['textarea','checkbox','radio'].includes(f.type)}">
                    <label class="lbl">{{ f.label }} <span v-if="isTrue(f.required)" class="req">*</span></label>
                    <textarea v-if="f.type==='textarea'" v-model="af.answers[f.key]" :placeholder="f.placeholder" :required="isTrue(f.required)"></textarea>
                    <select v-else-if="f.type==='select'" v-model="af.answers[f.key]" :required="isTrue(f.required)">
                      <option value="">Pilih…</option><option v-for="o in opts(f.options)" :key="o">{{ o }}</option>
                    </select>
                    <div v-else-if="f.type==='radio'" class="opts">
                      <label v-for="o in opts(f.options)" :key="o" class="opt"><input type="radio" :name="f.key" :value="o" v-model="af.answers[f.key]" :required="isTrue(f.required)">{{ o }}</label>
                    </div>
                    <div v-else-if="f.type==='checkbox'" class="opts">
                      <label v-for="o in opts(f.options)" :key="o" class="opt"><input type="checkbox" :value="o" v-model="af.answers[f.key]">{{ o }}</label>
                    </div>
                    <input v-else v-model="af.answers[f.key]" :type="f.type||'text'" :placeholder="f.placeholder" :required="isTrue(f.required)">
                  </div>
                </div>
                <div class="field" v-if="feat('cv_upload_enabled')">
                  <label class="lbl">{{ S.cv_label || 'Upload CV' }} <span v-if="isTrue(S.cv_required)" class="req">*</span></label>
                  <label class="dropzone">
                    <span class="dz-ic"><ico :n="af.file ? 'file' : 'upload'" :s="18"></ico></span>
                    <span style="min-width:0">
                      <b style="display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ af.file ? af.file.name : 'Pilih file CV' }}</b>
                      <span class="muted small">{{ af.file ? fmtSize(af.file.size) : 'PDF, DOC, DOCX, atau gambar · maks 10 MB' }}</span>
                    </span>
                    <input type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.jpg,.jpeg,.png" @change="af.file=$event.target.files[0]" :required="isTrue(S.cv_required)">
                  </label>
                </div>
                <div class="row" style="margin-top:8px"><span class="muted small">Data Anda hanya digunakan untuk keperluan rekrutmen.</span><div class="spacer"></div>
                  <button class="btn primary lg" :disabled="busy"><span v-if="busy" class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>{{ busy ? 'Mengirim…' : 'Kirim Lamaran' }}</button>
                </div>
              </form>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= LOGIN ================= -->
  <div v-else-if="view==='login'" class="login">
    <div class="login-art">
      <div class="row" style="gap:12px">
        <span v-if="logoState==='img'" class="logo-plate"><img :src="logoSrc" @error="onLogoError" :alt="S.company_name"></span>
        <span v-else-if="logoState==='loading'" class="logo-plate skel"></span>
        <span v-else class="logo-mark lg">{{ initials(S.company_name) }}</span>
        <b style="font-size:16px">{{ S.company_name }}</b>
      </div>
      <div>
        <h2>Kelola rekrutmen dalam satu tempat.</h2>
        <p>Lowongan, kandidat, jadwal interview, dan komunikasi — rapi dan terpusat.</p>
      </div>
      <div class="small" style="opacity:.7">{{ S.footer_text }}</div>
    </div>
    <div class="login-form">
      <div class="login-card">
        <h1>Masuk</h1>
        <p class="muted" style="margin-bottom:28px">Masuk ke panel rekrutmen {{ S.company_name }}.</p>
        <form @submit.prevent="login">
          <div class="field"><label class="lbl">Email</label><div class="input-icon"><ico n="mail"></ico><input v-model="lf.email" type="email" required autofocus placeholder="nama@perusahaan.com"></div></div>
          <div class="field"><label class="lbl">Password</label><div class="input-icon"><ico n="lock"></ico><input v-model="lf.password" type="password" required placeholder="••••••••"></div></div>
          <button class="btn primary lg block" style="margin-top:8px" :disabled="busy">{{ busy ? 'Memproses…' : 'Masuk' }}</button>
        </form>
        <a href="#" class="row muted small" style="margin-top:24px;gap:6px" @click.prevent="view='careers'"><ico n="arrowLeft" :s="14"></ico>Kembali ke halaman karir</a>
      </div>
    </div>
  </div>

  <!-- ================= ADMIN ================= -->
  <div v-else-if="view==='admin'" class="layout">
    <div class="mobile-top">
      <button class="btn icon sm" @click="sideOpen=!sideOpen" aria-label="Menu"><ico n="menu"></ico></button>
      <span>{{ S.company_name }}</span>
    </div>
    <aside class="side" :class="{open:sideOpen}">
      <div class="side-brand">
        <span v-if="logoState==='img'" class="logo-plate" :title="S.company_name"><img :src="logoSrc" @error="onLogoError" :alt="S.company_name"></span>
        <span v-else-if="logoState==='loading'" class="logo-plate skel"></span>
        <template v-else><span class="logo-mark">{{ initials(S.company_name) }}</span><span>{{ S.company_name || 'Rekrutmen' }}</span></template>
      </div>
      <nav class="nav">
        <div class="nav-label">Menu</div>
        <a v-for="m in menu" :key="m.id" :class="{on:tab===m.id}" @click="tab=m.id;sideOpen=false">
          <ico :n="m.icon" :s="17"></ico>{{ m.label }}<span v-if="m.count" class="count">{{ m.count }}</span>
        </a>
        <div class="nav-label">Publik</div>
        <a @click="view='careers'"><ico n="globe" :s="17"></ico>Halaman Karir</a>
      </nav>
      <div class="side-foot">
        <div class="me">
          <span class="avatar sm" :style="avStyle(user.name)">{{ initials(user.name) }}</span>
          <div style="min-width:0;flex:1"><div class="nm">{{ user.name }}</div><div class="rl">{{ roleLabel(user.role) }}</div></div>
        </div>
        <a href="#" class="logout" @click.prevent="logout"><ico n="logout" :s="14"></ico>Keluar</a>
      </div>
    </aside>

    <main class="main">
      <!-- ===== DASHBOARD ===== -->
      <template v-if="tab==='dashboard'">
        <div class="welcome">
          <div style="flex:1;min-width:240px">
            <div class="date">{{ todayLabel }}</div>
            <h2>Selamat datang, {{ firstName(user.name) }}</h2>
            <p>{{ new7 ? new7 + ' lamaran baru dalam 7 hari terakhir.' : 'Belum ada lamaran baru minggu ini.' }} {{ upcomingInterviews.length ? upcomingInterviews.length + ' interview menunggu.' : '' }}</p>
          </div>
          <button class="btn glass" @click="reload"><ico n="refresh" :s="15"></ico>Muat ulang</button>
          <button v-if="canEdit" class="btn white" @click="tab='jobs';edit('Jobs')"><ico n="plus" :s="15"></ico>Lowongan baru</button>
        </div>

        <div class="grid kpis" :class="feat('module_interviews') ? 'g4' : 'g3'" style="margin-bottom:16px">
          <div class="card kpi k1 stat">
            <div class="kh"><span class="ki"><ico n="users" :s="17"></ico></span>Total kandidat</div>
            <div class="n">{{ db.candidates.length }}</div>
            <span class="delta" :class="{up:new7}"><ico :n="new7?'up':'activity'" :s="12"></ico>{{ new7 }} dalam 7 hari</span>
          </div>
          <div class="card kpi k2 stat">
            <div class="kh"><span class="ki"><ico n="briefcase" :s="17"></ico></span>Lowongan aktif</div>
            <div class="n">{{ db.jobs.filter(j=>j.status==='Open').length }}</div>
            <span class="delta">dari {{ db.jobs.length }} lowongan</span>
          </div>
          <div v-if="feat('module_interviews')" class="card kpi k3 stat">
            <div class="kh"><span class="ki"><ico n="calendar" :s="17"></ico></span>Interview mendatang</div>
            <div class="n">{{ upcomingInterviews.length }}</div>
            <span class="delta">{{ interviewsToday }} hari ini</span>
          </div>
          <div class="card kpi k4 stat">
            <div class="kh"><span class="ki"><ico n="award" :s="17"></ico></span>Diterima</div>
            <div class="n">{{ countFinal('hired') }}</div>
            <span class="delta" :class="{up:countFinal('hired')}">{{ hireRate }}% tingkat penerimaan</span>
          </div>
        </div>

        <div class="g-dash" style="margin-bottom:16px">
          <div class="card chart s2">
            <div class="card-h"><span class="ci"><ico n="activity" :s="16"></ico></span><div><h3>Tren lamaran masuk</h3><div class="sub">14 hari terakhir · total {{ trend.reduce((a,t)=>a+t.count,0) }} lamaran</div></div></div>
            <div class="trend" role="img" :aria-label="'Grafik lamaran 14 hari terakhir'">
              <div v-for="(t,i) in trend" :key="t.key" class="tcol" :class="{'edge-l':i<3,'edge-r':i>trend.length-4}">
                <span class="tip">{{ t.full }} · <b>{{ t.count }}</b> lamaran</span>
                <span v-if="t.count && t.count===trendMax" class="val" :style="{bottom:(t.count/trendMax*100)+'%',marginBottom:'4px'}">{{ t.count }}</span>
                <div class="tbar" :class="{zero:!t.count}" :style="{height:(t.count/trendMax*100)+'%'}"></div>
              </div>
            </div>
            <div class="taxis"><span v-for="(t,i) in trend" :key="t.key">{{ i%2===0 || i===trend.length-1 ? t.short : '' }}</span></div>
          </div>
          <div class="card chart">
            <div class="card-h"><span class="ci"><ico n="globe" :s="16"></ico></span><div><h3>Sumber kandidat</h3><div class="sub">Dari mana kandidat datang</div></div></div>
            <div v-if="!sources.length" class="empty-state" style="padding:24px"><div class="ic"><ico n="inbox" :s="20"></ico></div><p>Belum ada data.</p></div>
            <template v-else>
              <div class="stackbar"><i v-for="(s,i) in sources" :key="s.name" :title="s.name+': '+s.count" :style="{width:s.pct+'%',background:s.color}"></i></div>
              <div v-for="(s,i) in sources" :key="s.name" class="hbar-row" :title="s.name+': '+s.count+' kandidat'">
                <span class="nm"><span class="legend-sw" :style="{background:s.color}"></span>{{ s.name }}</span>
                <span class="vv">{{ s.count }}<small>{{ s.pct }}%</small></span>
              </div>
            </template>
          </div>
        </div>

        <div class="grid g2" style="margin-bottom:16px">
          <div class="card chart">
            <div class="card-h"><span class="ci"><ico n="columns" :s="16"></ico></span><div><h3>Pipeline kandidat</h3><div class="sub">Sebaran per tahapan seleksi</div></div><div class="spacer"></div><a href="#" class="small" @click.prevent="tab='candidates'">Lihat semua</a></div>
            <div class="stackbar" v-if="db.candidates.length"><i v-for="s in db.stages.filter(s=>byStage(s.id).length)" :key="s.id" :title="s.name+': '+byStage(s.id).length" :style="{width:pct(byStage(s.id).length)+'%',background:s.color}"></i></div>
            <div v-for="s in db.stages" :key="s.id" class="hbar-row" style="cursor:pointer" @click="tab='candidates';kf.mode='table';kf.stage=s.id">
              <span class="nm"><span class="legend-sw" :style="{background:s.color}"></span>{{ s.name }}</span>
              <span class="vv">{{ byStage(s.id).length }}<small>{{ pct(byStage(s.id).length) }}%</small></span>
              <div class="bar"><i :style="{width:pct(byStage(s.id).length)+'%',background:s.color}"></i></div>
            </div>
          </div>
          <div class="card chart">
            <div class="card-h"><span class="ci"><ico n="briefcase" :s="16"></ico></span><div><h3>Kandidat per lowongan</h3><div class="sub">Lowongan dengan pelamar terbanyak</div></div><div class="spacer"></div><a href="#" class="small" @click.prevent="tab='jobs'">Kelola</a></div>
            <div v-if="!db.jobs.length" class="muted">Belum ada lowongan.</div>
            <div v-for="j in jobsByApplicants" :key="j.id" class="hbar-row" style="cursor:pointer" @click="tab='candidates';kf.job=j.id">
              <span class="nm">{{ j.title }} <span class="badge" :class="statusCls(j.status)">{{ statusLabel(j.status) }}</span></span>
              <span class="vv">{{ j.n }}</span>
              <div class="bar"><i :style="{width:(jobMax? j.n/jobMax*100 : 0)+'%',background:'linear-gradient(90deg,color-mix(in srgb,var(--p) 70%,#fff),var(--p))'}"></i></div>
            </div>
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <div class="card-h"><span class="ci"><ico n="inbox" :s="16"></ico></span><h3>Pelamar terbaru</h3></div>
            <div v-if="!db.candidates.length" class="empty-state" style="padding:24px"><div class="ic"><ico n="inbox" :s="20"></ico></div><p>Belum ada pelamar.</p></div>
            <div v-for="c in recentCandidates" :key="c.id" class="list-row" @click="openCand(c.id)">

                      <button class="btn ghost icon sm" title="Edit" @click="edit('Jobs',j)"><ico n="edit" :s="15"></ico></button>
                      <button class="btn ghost icon sm danger" title="Hapus" @click="del('Jobs',j)"><ico n="trash" :s="15"></ico></button>
                    </template>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </template>

      <!-- ===== KANDIDAT ===== -->
      <template v-if="tab==='candidates'">
        <div class="page-h">
          <div><h2>Kandidat</h2><p class="sub">{{ filteredCands.length }} kandidat · seret kartu untuk memindahkan tahapan.</p></div>
          <div class="spacer"></div>
          <div class="seg"><button :class="{on:kf.mode==='kanban'}" @click="kf.mode='kanban'"><ico n="columns" :s="14"></ico>Kanban</button><button :class="{on:kf.mode==='table'}" @click="kf.mode='table'"><ico n="list" :s="14"></ico>Tabel</button></div>
          <button v-if="feat('module_export')" class="btn" @click="exportCSV"><ico n="download" :s="15"></ico>Export</button>
          <button v-if="canEdit" class="btn primary" @click="edit('Candidates',{job_id:kf.job})"><ico n="plus" :s="16"></ico>Tambah Kandidat</button>
        </div>
        <div class="toolbar">
          <div class="input-icon grow"><ico n="search"></ico><input v-model="kf.q" placeholder="Cari nama, email, atau nomor HP…"></div>
          <select v-model="kf.job"><option value="">Semua lowongan</option><option v-for="j in db.jobs" :key="j.id" :value="j.id">{{ j.title }}</option></select>
          <select v-if="kf.mode==='table'" v-model="kf.stage"><option value="">Semua tahapan</option><option v-for="s in db.stages" :key="s.id" :value="s.id">{{ s.name }}</option></select>
        </div>
        <div v-if="kf.mode==='kanban'" class="kanban">
          <div v-for="s in db.stages" :key="s.id" class="col" :class="{over:dragOver===s.id}"

            <div class="col-h"><span class="dot" :style="{background:s.color}"></span>{{ s.name }}<span class="cnt">{{ filteredCands.filter(c=>c.stage_id===s.id).length }}</span></div>

              <div v-if="!filteredCands.filter(c=>c.stage_id===s.id).length" class="col-empty">Kosong</div>
              <div v-for="c in filteredCands.filter(c=>c.stage_id===s.id)" :key="c.id" class="kcard" :draggable="canEdit"
                   @dragstart="dragId=c.id" @click="openCand(c.id)">
                <div class="row" style="gap:10px;flex-wrap:nowrap">
                  <span class="avatar sm" :style="avStyle(c.name)">{{ initials(c.name) }}</span>
                  <div style="min-width:0"><div class="nm">{{ c.name }}</div><div class="jb">{{ jobName(c.job_id) }}</div></div>
                </div>
                <div class="ft">
                  <span v-if="feat('module_rating') && Number(c.rating)" class="row" style="gap:3px;color:#f59e0b"><ico n="star" :s="12" fill></ico><b class="num" style="color:var(--text-2)">{{ c.rating }}</b></span>
                  <ico v-if="c.cv_url" n="file" :s="13"></ico>
                  <div class="spacer"></div><span class="num">{{ fmtDate(c.created_at) }}</span>
                </div>
              </div>
            </div>
          </div>
          <div v-if="orphanCands.length" class="col">
            <div class="col-h"><span class="dot" style="background:#a1a1aa"></span>Tanpa tahapan<span class="cnt">{{ orphanCands.length }}</span></div>
            <div class="col-b"><div v-for="c in orphanCands" :key="c.id" class="kcard" :draggable="canEdit" @dragstart="dragId=c.id" @click="openCand(c.id)"><div class="nm">{{ c.name }}</div></div></div>
          </div>
        </div>
        <div v-else class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Kandidat</th><th>Lowongan</th><th>Tahapan</th><th>Rating</th><th>Sumber</th><th>Melamar</th></tr></thead>
            <tbody>
              <tr v-if="!filteredCands.length"><td colspan="6"><div class="empty-state"><div class="ic"><ico n="users" :s="20"></ico></div><h4>Tidak ada kandidat</h4><p>Belum ada kandidat yang cocok dengan filter.</p></div></td></tr>
              <tr v-for="c in filteredCands" :key="c.id" class="click" @click="openCand(c.id)">
                <td><div class="cell-user"><span class="avatar" :style="avStyle(c.name)">{{ initials(c.name) }}</span><div><div class="title">{{ c.name }}</div><div class="sub">{{ c.email }}<template v-if="c.phone"> · {{ c.phone }}</template></div></div></div></td>

                <td><span v-if="Number(c.rating)" class="row" style="gap:3px;color:#f59e0b"><ico n="star" :s="13" fill></ico><b class="num" style="color:var(--text-2)">{{ c.rating }}</b></span><span v-else class="faint">—</span></td>

                <td class="nowrap muted">{{ fmtDate(c.created_at) }}</td>
              </tr>
            </tbody>
          </table>
        </div>

          <div><h2>Interview</h2><p class="sub">Jadwal, pewawancara, dan hasil penilaian.</p></div>

          <button v-if="canEdit" class="btn primary" @click="edit('Interviews')"><ico n="plus" :s="16"></ico>Jadwalkan</button>
        </div>
        <div class="toolbar">
          <div class="seg"><button v-for="w in [['upcoming','Mendatang'],['past','Selesai/lewat'],['','Semua']]" :key="w[0]" :class="{on:if_.when===w[0]}" @click="if_.when=w[0]">{{ w[1] }}</button></div>
          <select v-model="if_.status"><option value="">Semua status</option><option v-for="s in interviewStatuses" :key="s">{{ s }}</option></select>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Waktu</th><th>Kandidat</th><th>Interview</th><th>Lokasi</th><th>Status</th><th>Skor</th><th></th></tr></thead>

              <tr v-if="!filteredInterviews.length"><td colspan="7"><div class="empty-state"><div class="ic"><ico n="calendar" :s="20"></ico></div><h4>Tidak ada jadwal</h4><p>Jadwal interview akan tampil di sini.</p></div></td></tr>
              <tr v-for="i in filteredInterviews" :key="i.id">
                <td class="nowrap"><div class="row" style="gap:12px;flex-wrap:nowrap"><span class="date-box"><span class="m">{{ monthShort(i.datetime) }}</span><span class="d">{{ dayNum(i.datetime) }}</span></span><div><div class="title num">{{ timeOf(i.datetime) }}</div><div class="sub" v-if="i.duration">{{ i.duration }} menit</div></div></div></td>
                <td><a href="#" class="title" style="color:var(--text)" @click.prevent="openCand(i.candidate_id)">{{ candName(i.candidate_id) }}</a><div class="sub">{{ jobName((candById(i.candidate_id)||{}).job_id) }}</div></td>
                <td>{{ i.title || 'Interview' }}<div class="sub">{{ i.interviewer }}</div></td>
                <td><a v-if="/^https?:/.test(i.location)" :href="i.location" target="_blank" class="row" style="gap:5px">Buka link <ico n="external" :s="13"></ico></a><span v-else>{{ i.location || '—' }}</span></td>
                <td><span class="badge" :class="ivCls(i.status)">{{ i.status }}</span></td>
                <td class="num">{{ i.score || '—' }}</td>
                <td class="right nowrap"><span v-if="canEdit" class="actions"><button class="btn ghost icon sm" title="Edit" @click="edit('Interviews',i)"><ico n="edit" :s="15"></ico></button><button class="btn ghost icon sm danger" title="Hapus" @click="del('Interviews',i)"><ico n="trash" :s="15"></ico></button></span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </template>

      <!-- ===== PENGATURAN ===== -->
      <template v-if="tab==='settings'">
        <div class="page-h"><div><h2>Pengaturan</h2><p class="sub">Sesuaikan aplikasi tanpa menyentuh kode.</p></div></div>
        <div class="tabs">
          <a v-for="t in settingTabs" :key="t.id" :class="{on:stab===t.id}" @click="stab=t.id">{{ t.label }}</a>
        </div>

        <div v-if="stab==='general'" class="card" style="padding:8px 24px 24px">
          <form @submit.prevent="saveSettings">
            <div v-for="g in settingGroups" :key="g.id" class="set-sec">
              <div><h3>{{ g.title }}</h3><p class="desc">{{ g.desc }}</p></div>
              <div class="grid g2" style="gap:0 16px">
                <div v-for="f in settingFields.filter(x=>x.g===g.id)" :key="f.k" class="field" :class="{'span-2':f.t==='textarea'||f.t==='checkbox'||f.full}">
                  <label v-if="f.t==='checkbox'" class="check"><input type="checkbox" :checked="isTrue(sf[f.k])" @change="sf[f.k]=$event.target.checked?'true':'false'">{{ f.l }}</label>
                  <template v-else>
                    <label class="lbl">{{ f.l }}</label>
                    <textarea v-if="f.t==='textarea'" v-model="sf[f.k]"></textarea>
                    <div v-else-if="f.t==='color'" class="color-field"><input type="color" v-model="sf[f.k]"><input v-model="sf[f.k]"></div>
                    <input v-else v-model="sf[f.k]" :type="f.t||'text'" :placeholder="f.ph||''">
                  </template>
                  <div v-if="f.h" class="help">{{ f.h }}</div>
                </div>
              </div>
            </div>
            <div v-if="customSettingKeys.length" class="set-sec">
              <div><h3>Lainnya</h3><p class="desc">Pengaturan tambahan yang ada di spreadsheet.</p></div>
              <div class="grid g2" style="gap:0 16px">
                <div v-for="k in customSettingKeys" :key="k" class="field"><label class="lbl"><code>{{ k }}</code></label><input v-model="sf[k]"></div>
              </div>
            </div>
            <div class="set-actions">
              <a :href="db.sheetUrl" target="_blank" class="row small" style="gap:5px"><ico n="external" :s="13"></ico>Spreadsheet</a>
              <a :href="db.folderUrl" target="_blank" class="row small" style="gap:5px"><ico n="external" :s="13"></ico>Folder CV</a>
              <div class="spacer"></div>
              <button class="btn primary" :disabled="busy">Simpan Pengaturan</button>
            </div>
          </form>
        </div>

        <!-- Fitur & Modul -->
        <div v-if="stab==='features'">
          <div class="toolbar"><div class="hint" style="flex:1"><ico n="info" :s="16"></ico><span>Aktifkan atau nonaktifkan fitur dengan satu klik — perubahan langsung tersimpan dan berlaku untuk semua pengguna. Data yang sudah ada tidak dihapus.</span></div></div>
          <div v-for="g in featureGroups" :key="g.title" class="feat-group">

            <div v-for="(s,i) in db.stages" :key="s.id" class="list-item">
              <div class="handle"><button title="Naik" @click="move('Stages',db.stages,i,-1)"><ico n="up" :s="14"></ico></button><button title="Turun" @click="move('Stages',db.stages,i,1)"><ico n="down" :s="14"></ico></button></div>

              <b style="flex:1;font-weight:600">{{ s.name }}</b>

              <span class="actions"><button class="btn ghost icon sm" title="Edit" @click="edit('Stages',s)"><ico n="edit" :s="15"></ico></button><button class="btn ghost icon sm danger" title="Hapus" @click="del('Stages',s)"><ico n="trash" :s="15"></ico></button></span>

          <div class="list-card">
            <div v-for="(f,i) in db.fields" :key="f.id" class="list-item">
              <div class="handle"><button title="Naik" @click="move('FormFields',db.fields,i,-1)"><ico n="up" :s="14"></ico></button><button title="Turun" @click="move('FormFields',db.fields,i,1)"><ico n="down" :s="14"></ico></button></div>

              <span class="actions"><button class="btn ghost icon sm" title="Edit" @click="edit('FormFields',f)"><ico n="edit" :s="15"></ico></button><button class="btn ghost icon sm danger" title="Hapus" @click="del('FormFields',f)"><ico n="trash" :s="15"></ico></button></span>

            <div v-if="!db.fields.length" class="empty">Belum ada field tambahan.</div>
          </div>
        </div>

        <!-- Master data -->
        <div v-if="stab==='master'">
          <div class="toolbar"><div class="hint" style="flex:1"><ico n="info" :s="16"></ico><span>Pilihan untuk dropdown: departemen, lokasi, tipe pekerjaan, sumber kandidat. Anda juga bisa membuat jenis baru.</span></div><button class="btn primary" @click="edit('Master',{type:mtab})"><ico n="plus" :s="16"></ico>Data</button></div>
          <div class="pill-tabs"><a v-for="t in masterTypes" :key="t" :class="{on:mtab===t}" @click="mtab=t">{{ masterLabel(t) }}</a></div>

          </div>

              <thead><tr><th>Template</th><th>Dipicu saat</th><th>Status</th><th></th></tr></thead>

                </tr>
              </tbody>
            </table>
          </div>

                  <td><div class="cell-user"><span class="avatar" :style="avStyle(u.name)">{{ initials(u.name) }}</span><div><div class="title">{{ u.name }} <span v-if="u.id===user.id" class="badge" style="margin-left:4px">Anda</span></div><div class="sub">{{ u.email }}</div></div></div></td>
                  <td>{{ roleLabel(u.role) }}</td>
                  <td><span class="badge" :class="isTrue(u.active)?'b-open':'b-closed'">{{ isTrue(u.active)?'Aktif':'Nonaktif' }}</span></td>
                  <td class="right nowrap"><span class="actions"><button class="btn ghost icon sm" title="Edit" @click="edit('Users',u)"><ico n="edit" :s="15"></ico></button><button v-if="u.id!==user.id" class="btn ghost icon sm danger" title="Hapus" @click="del('Users',u)"><ico n="trash" :s="15"></ico></button></span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- ===== AKUN ===== -->
      <template v-if="tab==='account'">
        <div class="page-h"><div><h2>Akun saya</h2><p class="sub">Profil dan keamanan akun Anda.</p></div></div>
        <div class="card" style="padding:8px 24px 24px;max-width:900px">
          <form class="set-sec" @submit.prevent="saveProfile">
            <div><h3>Profil</h3><p class="desc">Nama ini tampil di riwayat aktivitas dan jadwal interview.</p></div>
            <div>
              <div class="row" style="gap:14px;margin-bottom:18px"><span class="avatar lg" :style="avStyle(user.name)">{{ initials(user.name) }}</span><div><div style="font-weight:600">{{ user.email }}</div><div class="muted small">{{ roleLabel(user.role) }}</div></div></div>
              <div class="field"><label class="lbl">Nama</label><input v-model="pf.name" required></div>
              <button class="btn primary" :disabled="busy">Simpan</button>
            </div>
          </form>
          <form class="set-sec" style="border-bottom:none" @submit.prevent="changePassword">
            <div><h3>Password</h3><p class="desc">Gunakan minimal 6 karakter. Ganti password bawaan segera.</p></div>
            <div>
              <div class="field"><label class="lbl">Password lama</label><input v-model="pw.old" type="password" required></div>
              <div class="grid g2" style="gap:0 16px">
                <div class="field"><label class="lbl">Password baru</label><input v-model="pw.new" type="password" minlength="6" required></div>
                <div class="field"><label class="lbl">Ulangi password baru</label><input v-model="pw.new2" type="password" minlength="6" required></div>
              </div>
              <button class="btn primary" :disabled="busy">Ganti Password</button>
            </div>
          </form>
        </div>
      </template>
    </main>

    <!-- ===== DRAWER KANDIDAT ===== -->
    <template v-if="cand">
      <div class="drawer-bg" @click="candId=null"></div>
      <div class="drawer">
        <div class="drawer-h">
          <div class="row" style="gap:14px;flex-wrap:nowrap;align-items:flex-start">
            <span class="avatar lg" :style="avStyle(cand.name)">{{ initials(cand.name) }}</span>
            <div style="flex:1;min-width:0;padding-top:3px"><h3 style="font-size:18px">{{ cand.name }}</h3><div class="muted small">{{ jobName(cand.job_id) }} · melamar {{ fmtDate(cand.created_at) }}</div></div>
            <button class="x" @click="candId=null" aria-label="Tutup"><ico n="x" :s="18"></ico></button>
          </div>
          <div class="row" style="margin-top:16px">
            <select :value="cand.stage_id" @change="moveCand(cand,$event.target.value)" :disabled="!canEdit" style="width:auto;min-width:180px;height:34px">
              <option v-for="s in db.stages" :key="s.id" :value="s.id">{{ s.name }}</option>
            </select>
            <div v-if="feat('module_rating')" class="stars"><button v-for="n in 5" :key="n" class="star" :class="{on:n<=Number(cand.rating||0)}" :disabled="!canEdit" :title="n+' bintang'" @click="setRating(cand,n)"><ico n="star" :s="18" fill></ico></button></div>
            <div class="spacer"></div>
            <template v-if="canEdit">
              <button class="btn sm" @click="edit('Candidates',cand)"><ico n="edit" :s="14"></ico>Edit</button>
              <button class="btn sm danger" @click="del('Candidates',cand)"><ico n="trash" :s="14"></ico>Hapus</button>
            </template>
          </div>
        </div>
        <div class="drawer-b">
          <div class="d-card">
            <div class="d-card-h"><ico n="user" :s="15"></ico>Kontak</div>
            <dl class="kv">
              <dt>Email</dt><dd><a :href="'mailto:'+cand.email">{{ cand.email }}</a></dd>
              <dt>No. HP</dt><dd><a v-if="cand.phone" :href="waLink(cand.phone)" target="_blank" class="row" style="gap:5px;display:inline-flex">{{ cand.phone }} <ico n="external" :s="12"></ico></a><span v-else class="faint">—</span></dd>
              <dt>Sumber</dt><dd>{{ cand.source || '—' }}</dd>
              <dt>CV</dt><dd class="row" style="gap:8px">
                <a v-if="cand.cv_url" :href="cand.cv_url" target="_blank" class="file-chip"><ico n="file" :s="15"></ico><span>{{ cand.cv_name || 'Lihat CV' }}</span></a><span v-else class="faint">Belum ada</span>
                <label v-if="canEdit" class="btn sm"><ico n="upload" :s="13"></ico>{{ cand.cv_url?'Ganti':'Upload' }}<input type="file" style="display:none" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.jpg,.jpeg,.png" @change="uploadCV(cand,$event)"></label>
              </dd>
            </dl>
          </div>
          <div class="d-card">
            <div class="d-card-h"><ico n="list" :s="15"></ico>Jawaban Form</div>
            <dl class="kv" v-if="answerList(cand).length">
              <template v-for="a in answerList(cand)" :key="a.k"><dt>{{ a.l }}</dt><dd class="pre">{{ a.v }}</dd></template>
            </dl>
            <div v-else class="faint">Tidak ada jawaban tambahan.</div>
          </div>
          <div v-if="feat('module_notes')" class="d-card">
            <div class="d-card-h"><ico n="note" :s="15"></ico>Catatan internal</div>
            <textarea v-model="noteDraft" :disabled="!canEdit" placeholder="Tulis catatan tentang kandidat ini…"></textarea>
            <div class="row" style="margin-top:10px" v-if="canEdit"><div class="spacer"></div><button class="btn sm primary" :disabled="noteDraft===(cand.notes||'')" @click="saveNote(cand)">Simpan catatan</button></div>
          </div>
          <div v-if="feat('module_interviews')" class="d-card">
            <div class="d-card-h"><ico n="calendar" :s="15"></ico>Interview<div class="spacer"></div><button v-if="canEdit" class="btn sm" @click="edit('Interviews',{candidate_id:cand.id})"><ico n="plus" :s="14"></ico>Jadwalkan</button></div>
            <div v-if="!candInterviews.length" class="faint">Belum ada jadwal.</div>
            <div v-for="i in candInterviews" :key="i.id" class="iv">
              <div class="row"><b style="font-weight:600">{{ i.title || 'Interview' }}</b><span class="badge" :class="ivCls(i.status)">{{ i.status }}</span><div class="spacer"></div><button v-if="canEdit" class="btn ghost icon sm" title="Edit" @click="edit('Interviews',i)"><ico n="edit" :s="14"></ico></button></div>
              <div class="small muted" style="margin-top:2px">{{ fmtDateTime(i.datetime) }}<template v-if="i.interviewer"> · {{ i.interviewer }}</template><template v-if="i.location"> · {{ i.location }}</template></div>
              <div v-if="i.score" class="small" style="margin-top:6px">Skor <b class="num">{{ i.score }}</b></div>
              <div v-if="i.feedback" class="small pre" style="margin-top:4px;color:var(--text-2)">{{ i.feedback }}</div>
            </div>
          </div>
          <div class="d-card" v-if="canEdit && feat('module_email_manual')">
            <div class="d-card-h"><ico n="mail" :s="15"></ico>Kirim email</div>
            <div class="field"><select v-model="mailTpl" @change="applyTpl"><option value="">Gunakan template…</option><option v-for="t in db.templates" :key="t.id" :value="t.id">{{ t.name }}</option></select></div>
            <div class="field"><input v-model="mail.subject" placeholder="Subjek"></div>
            <div class="field"><textarea v-model="mail.body" placeholder="Isi email (boleh memakai variabel seperti {{name}})"></textarea></div>
            <div class="row"><span class="muted small">Ke {{ cand.email }}</span><div class="spacer"></div><button class="btn sm primary" :disabled="busy||!mail.subject||!mail.body" @click="sendMail(cand)"><ico n="send" :s="13"></ico>Kirim</button></div>
          </div>
          <div class="d-card">
            <div class="d-card-h"><ico n="activity" :s="15"></ico>Riwayat aktivitas</div>
            <div v-if="activityLoading" class="faint">Memuat…</div>
            <div v-else-if="!activity.length" class="faint">Belum ada aktivitas.</div>
            <div v-else class="timeline">
              <div v-for="a in activity" :key="a.id" class="tl-item">
                <div style="font-size:13.5px"><b style="font-weight:600">{{ a.action }}</b> <span class="muted">{{ a.detail }}</span></div>
                <div class="small faint">{{ a.user }} · {{ fmtDateTime(a.created_at) }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ================= MODAL GENERIK ================= -->
  <div v-if="modal" class="overlay" @click.self="modal=null">
    <div class="modal">
      <div class="modal-h"><div><h3>{{ modal.rec.id ? 'Edit' : 'Tambah' }} {{ ENT[modal.table].title.toLowerCase() }}</h3></div><button class="x" @click="modal=null" aria-label="Tutup"><ico n="x" :s="18"></ico></button></div>
      <form @submit.prevent="saveModal">
        <div class="modal-b">
          <div class="grid g2" style="gap:0 16px">
            <div v-for="f in ENT[modal.table].fields.filter(f=>!f.show||f.show(modal.rec))" :key="f.k" class="field" :class="{'span-2':f.full||f.t==='textarea'}">
              <label v-if="f.t==='checkbox'" class="check"><input type="checkbox" :checked="isTrue(modal.rec[f.k])" @change="modal.rec[f.k]=$event.target.checked?'true':'false'">{{ f.l }}</label>
              <template v-else>
                <label class="lbl">{{ f.l }} <span v-if="f.req" class="req">*</span></label>
                <textarea v-if="f.t==='textarea'" v-model="modal.rec[f.k]" :required="f.req" :rows="f.rows||4" :placeholder="f.ph||''"></textarea>
                <select v-else-if="f.t==='select'" v-model="modal.rec[f.k]" :required="f.req">
                  <option value="">—</option>
                  <option v-for="o in optList(f)" :key="o.v" :value="o.v">{{ o.l }}</option>
                </select>
                <template v-else-if="f.t==='combo'">
                  <input v-model="modal.rec[f.k]" :list="'dl-'+f.k" :required="f.req">
                  <datalist :id="'dl-'+f.k"><option v-for="o in optList(f)" :key="o.v" :value="o.v">{{ o.l }}</option></datalist>
                </template>
                <div v-else-if="f.t==='color'" class="color-field"><input type="color" v-model="modal.rec[f.k]"><input v-model="modal.rec[f.k]"></div>
                <input v-else v-model="modal.rec[f.k]" :type="f.t||'text'" :required="f.req && !(f.t==='password' && modal.rec.id)" :placeholder="f.ph && (typeof f.ph==='function'?f.ph(modal.rec):f.ph) || ''">
              </template>
              <div v-if="f.h" class="help">{{ f.h }}</div>
            </div>
          </div>
          <div v-if="modal.table==='Candidates' && !modal.rec.id" class="field">
            <label class="lbl">CV (opsional)</label>
            <label class="dropzone">
              <span class="dz-ic"><ico :n="modal.file ? 'file' : 'upload'" :s="18"></ico></span>
              <span><b style="display:block;font-weight:600">{{ modal.file ? modal.file.name : 'Pilih file CV' }}</b><span class="muted small">PDF, DOC, DOCX, atau gambar · maks 10 MB</span></span>
              <input type="file" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.jpg,.jpeg,.png" @change="modal.file=$event.target.files[0]">
            </label>
          </div>
        </div>
        <div class="modal-f"><button type="button" class="btn" @click="modal=null">Batal</button><button class="btn primary" :disabled="busy">{{ busy?'Menyimpan…':'Simpan' }}</button></div>
      </form>
    </div>
  </div>

  <div v-if="toast" class="toast" :class="toast.type"><ico :n="toast.type==='error'?'alert':'check'" :s="16"></ico>{{ toast.msg }}</div>
</div>
</script>
